name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests + quick smoke (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package with test extras
        run: python -m pip install -e '.[test]'
      - name: Unit, schema and determinism tests
        run: pytest -q
      - name: Quick-mode smoke run
        run: |
          cytology-lab train --quick --output smoke-artifacts
          test -s smoke-artifacts/report.json
          test -s smoke-artifacts/model.joblib
          test -s smoke-artifacts/test_probabilities.png
      - name: Evidence assistant smoke check
        run: |
          cytology-lab ask "How was the model selected?" --report smoke-artifacts/report.json | grep -q 'report.json:selection'
          cytology-lab ask "diagnose my patient" --report smoke-artifacts/report.json | grep -q 'cannot interpret'
